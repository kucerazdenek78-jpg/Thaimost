name: Android tablet APK

on:
  push:
    branches: [main]
    paths:
      - 'kartoteka/android-tablet/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Sestavit APK
        run: gradle -p kartoteka/android-tablet assembleRelease --no-daemon
      - name: Přejmenovat
        run: |
          mkdir -p out
          cp kartoteka/android-tablet/app/build/outputs/apk/release/*.apk out/thai-most-tablet.apk
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: thai-most-tablet
          path: out/thai-most-tablet.apk
      - name: Vydání (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tablet-latest
          name: Thai Most Tablet (Android)
          files: out/thai-most-tablet.apk
          make_latest: true
