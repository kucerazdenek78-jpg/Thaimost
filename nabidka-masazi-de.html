<head>

<style>
:root{--teak:#2b1e16;--teak2:#47321f;--bark:#6b4d33;--gold:#c69c5d;--gold-l:#e6d0a6;
  --cream:#f8f2e9;--sand:#efe4d3;--paper:#fffdf9;--jade:#3d6858;--ink:#2a211b;--muted:#7a6a5c;--line:rgba(43,30,22,.14);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:"Manrope",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;background:#d9cdbb;-webkit-print-color-adjust:exact;print-color-adjust:exact}
h1,h2,h3,h4,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.08;letter-spacing:-.01em}
.paper{width:297mm;margin:24px auto 60px;background:var(--paper);box-shadow:0 22px 55px -26px rgba(43,30,22,.55);padding:12mm 14mm}
.cover{background:radial-gradient(120% 120% at 50% 0%, #3a281c 0%, #2b1e16 55%, #221711 100%);color:var(--cream);border-radius:4mm;min-height:185mm;padding:14mm;display:flex;break-after:page;page-break-after:always}
.cover-fr{border:1px solid rgba(230,208,166,.25);border-radius:3mm;padding:12mm 16mm;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand{display:flex;align-items:center;gap:12px;color:var(--gold-l)}
.brand .lotus{width:48px;height:auto;color:var(--gold)}
.brand .bt{text-align:left;line-height:1}
.brand .bt b{font-family:"Cormorant Garamond",serif;font-size:28px;font-weight:600;display:block;color:var(--gold-l)}
.brand .bt span{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(230,208,166,.75)}
.cover-mid{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.eyebrow{letter-spacing:.42em;text-transform:uppercase;font-size:13px;color:var(--gold)}
.cover h1{font-size:56px;color:#fff}
.cover .lead{max-width:150mm;color:rgba(248,242,233,.82);font-size:15px;line-height:1.7}
.cover-foot{margin-top:auto;font-size:13px;color:rgba(230,208,166,.85);display:flex;gap:18px}
.svc{padding-top:0}
.svc.brk{break-before:page;page-break-before:always}
.section{display:flex;align-items:center;gap:16px;margin:0 0 6mm;break-after:avoid}
.section .line{flex:1;height:1px;background:var(--line)}
.section>div{text-align:center}
.section h2{font-size:28px;color:var(--teak)}
.section p{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.card{display:flex;gap:9mm;min-height:80mm;margin-bottom:7mm;break-inside:avoid;page-break-inside:avoid}
.photo{flex:0 0 150mm;align-self:stretch;min-height:80mm;border-radius:3mm;background-color:var(--sand);background-position:center;background-size:cover;background-repeat:no-repeat}
video.photo{display:block;object-fit:cover;width:150mm;height:auto}
.photo.prt{display:none}
.qrp{display:none}
@media print{
 .photo.scr{display:none}
 .photo.prt{display:block}
 .qrp{display:flex;align-items:center;gap:5mm;margin-top:5mm;padding-top:4mm;border-top:1px solid var(--line);break-inside:avoid}
 .qrp img{width:22mm;height:22mm;flex:0 0 22mm}
 .qrt b{display:block;font-size:12.5px;color:var(--teak);margin-bottom:1mm}
 .qrt span{font-size:10.5px;line-height:1.5;color:var(--muted)}
}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:1mm 0}
.card h3{font-size:26px;color:var(--teak);margin-bottom:3mm}
.desc{font-size:12.7px;line-height:1.62;color:#3a2f26}
.pozn{font-size:11.5px;font-style:italic;color:var(--muted);margin-top:2.5mm}
.prices{margin-top:4mm;display:flex;flex-direction:column;gap:2mm}
.price{display:flex;align-items:baseline;gap:8px;font-size:13px}
.price .pn{color:var(--bark);font-weight:600}
.price .dots{flex:1;border-bottom:1.5px dotted rgba(43,30,22,.28);transform:translateY(-3px)}
.price .pc{font-family:"Cormorant Garamond",serif;font-size:18.5px;font-weight:600;color:var(--teak);white-space:nowrap}
.back{break-before:page;page-break-before:always;display:flex;flex-direction:column;min-height:185mm}
.brand.dark{color:var(--bark);margin-bottom:9mm}
.brand.dark .lotus{color:var(--gold)}
.brand.dark .bt b{color:var(--teak)}
.brand.dark .bt span{color:var(--muted)}
.back-grid{display:grid;grid-template-columns:1fr 1fr;gap:12mm;margin-bottom:9mm}
.bk h4{font-size:21px;color:var(--teak);margin-bottom:5mm}
.ot{display:flex;justify-content:space-between;gap:12px;padding:2.6mm 0;border-bottom:1px solid var(--line);font-size:13px}
.ot b{color:var(--bark);font-weight:600}
.ot span{color:#3a2f26;text-align:right;max-width:100mm}
.bk p{font-size:13.5px;line-height:1.7;color:#3a2f26;margin-bottom:3mm}
.gift{display:grid;grid-template-columns:1.5fr 1fr;gap:9mm;background:var(--cream);border:1px solid var(--line);border-radius:3mm;padding:8mm;align-items:center}
.gift h4{font-size:21px;color:var(--teak);margin-bottom:4mm}
.gift p{font-size:12.5px;line-height:1.6;color:#3a2f26}
.loy{text-align:center;border-left:1px solid var(--line);padding-left:8mm}
.loy b{font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--bark);display:block;line-height:1.15;margin-bottom:3mm}
.loy span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.note{margin-top:auto;padding-top:9mm;font-size:11px;color:var(--muted);text-align:center}
.bar{position:fixed;top:14px;right:14px;z-index:50;display:flex;gap:8px}
.bar button{font-family:inherit;font-weight:700;font-size:13px;border:0;border-radius:999px;padding:11px 20px;cursor:pointer;background:var(--teak);color:var(--cream)}
.hint{max-width:297mm;margin:0 auto 6px;text-align:center;font-size:12.5px;color:#6b5a49}
.load{margin:40px auto;text-align:center;color:#6b5a49}
@media print{html,body{background:#fff}.bar,.hint{display:none!important}.paper{width:auto;margin:0;padding:0;box-shadow:none}.cover,.back{min-height:170mm}@page{size:A4 landscape;margin:12mm 14mm}}
</style>

var NAZVY2={"tradicni": "Traditionelle Thai-Massage", "hlava": "Kopf- & Nackenmassage", "zada": "Rücken- & Nackenmassage", "olej": "Thailändische Ölmassage", "aroma": "Aromamassage", "detska": "Kindermassage", "lymfa-oblicej": "Lymphdrainage für Gesicht & Dekolleté", "poporodni": "Massage nach der Geburt", "oblicej": "Gesichtsmassage", "nohy": "Fußmassage", "bylinna": "Kräutermassage", "siam": "Siam-Massage", "ventosa": "Schröpfmassage (Ventosa)", "lava": "Gesichtsmassage mit Lavasteinen", "lymfa-telo": "Manuelle Lymphdrainage am ganzen Körper", "tehotenska": "Schwangerschaftsmassage", "whirlpool": "Whirlpool & Sauna", "fiji": "Fidschi-Ritual", "cukr": "Ein süßer Hauch aus dem Paradies"};
var POPISY2={"tradicni": "Die bekannteste Form der Thai-Massage mit jahrhundertealter Tradition. Die Masseurin übt mit Handflächen, Daumen, Ellbogen und Füßen Druck entlang der Energiebahnen aus und ergänzt die Massage durch passive Dehnungen in sanften Yoga-Haltungen. Sie findet ohne Öl auf einer bequemen Matte am Boden statt, der Kunde bleibt bekleidet. Sie lockert verspannte Muskeln, verbessert die Beweglichkeit und schenkt ein Gefühl von Leichtigkeit und frischer Energie.", "hlava": "Eine sanfte Trockenmassage der Halswirbelsäule, des Kopfes, Nackens und der Schultern. Gezielter Druck auf Akupressurpunkte löst Verspannungen und Blockaden, die sich hier durch langes Sitzen und Stress ansammeln. Sie wirkt angenehm beruhigend, lindert einen steifen Nacken und hilft bei Kopfschmerzen durch Überlastung.", "zada": "Eine Massage, die sich auf die am stärksten beanspruchten Bereiche konzentriert – Nacken, Schultern und den unteren Rücken. Sie kombiniert Kneten, Druck und Dehnung, um Muskelverspannungen durch sitzende Tätigkeit zu lösen. Regelmäßige Anwendungen helfen, einen steifen Rücken zu lockern und seine Beweglichkeit wiederherzustellen.", "olej": "Eine sehr angenehme, wohltuende Form der Thai-Massage. Sanfte bis mittelstarke, fließende Streichungen verbinden sich mit der Wirkung aromatischer Öle aus thailändischen Kräutern, die die Haut pflegen und den ganzen Körper umschmeicheln. Die ideale Wahl, wenn Sie sich tiefe Entspannung und Ruhe gönnen möchten.", "aroma": "Eine Ganzkörper-Ölmassage mit Duftölen Ihrer Wahl, ergänzt durch das Einatmen von Essenzen zur Beruhigung der Sinne. Zur Wahl stehen erfrischende Limette mit Bambus oder belebendes Zitronengras mit Orange. Sanfte Streichungen entspannen Körper und Geist und schaffen ein Gefühl ganzheitlicher Harmonie.", "detska": "Eine sanfte Ganzkörper-Ölmassage für Kinder von 2 bis 10 Jahren, langsam und einfühlsam je nach Alter und Verfassung des Kindes. Sanftes Streicheln fördert Entspannung, besseren Schlaf und eine angenehme Zeit. Die Masseurin passt Druck und Dauer so an, dass sich das Kind sicher fühlt.", "lymfa-oblicej": "Sehr sanfte, langsame Streichungen auf trockener Haut – ohne Öle und Cremes – in Richtung der Lymphbahnen. Sie helfen, überschüssige Flüssigkeit abzuleiten, den Teint aufzuhellen und die natürliche Regeneration der Haut zu fördern. Danach wirken Gesicht und Dekolleté frisch und erholt.", "poporodni": "Eine behutsame Verbindung aus traditioneller Thai-Massage und Kräuterpflege, bei der warme Kräutersäckchen auf die nach der Geburt beanspruchten Partien aufgelegt werden. Wärme und sanfter Druck helfen, Verspannungen zu lösen und die Regeneration zu fördern. Stets rücksichtsvoll auf die Bedürfnisse der Mutter abgestimmt.", "oblicej": "Eine Kombination aus kosmetischer Hautbehandlung und Akupressur-Gesichtsmassage. Sie umfasst ein Peeling, eine Gesichtsmaske und regenerierende Cremes; während die Maske einwirkt, wird zusätzlich die Halswirbelsäule massiert. Nach der Behandlung wirkt die Haut durchblutet, glatt und erholt.", "nohy": "Ein Teil der traditionellen Thai-Massage für müde und geschwollene Beine, ergänzt durch Fußreflexzonenmassage. Die Masseurin arbeitet mit thailändischem Balsam oder erwärmten Kräutersäckchen, die die Muskeln angenehm wärmen. Das verschafft schweren Beinen Linderung und gibt ihnen Leichtigkeit zurück.", "bylinna": "Eine belebende Kräutermassage nach der traditionellen thailändischen Medizin. Die klassische Thai-Massage wird durch heiße Kräutersäckchen ergänzt, deren Wärme und Duft die Muskelentspannung vertiefen. Eine wärmende, aromatische Behandlung, ideal für kalte Tage und einen erschöpften Körper.", "siam": "Eine heiße Kräutermassage aus der traditionellen thailändischen Medizin. Erwärmte Kräutersäckchen voller aromatischer Kräuter werden aufgelegt und sanft einmassiert – die Wärme löst Muskelverspannungen, macht die Haut geschmeidig und wärmt bis in die Tiefe. Ein zutiefst entspannendes Ritual für Körper und Sinne.", "ventosa": "Eine traditionelle philippinische Massage, die Ganzkörper-Ölmassage, Schröpfen mit Glasgefäßen und Ohrkerzen vereint. Der Unterdruck der Schröpfgläser fördert die Durchblutung des Gewebes und hilft, tiefe Muskelverspannungen zu lösen. Eine kräftige, wohltuende Behandlung für alle, die eine intensivere Massage schätzen.", "lava": "Eine Gesichtsmassage mit der Wärme und den sanften Schwingungen glatter Lavasteine. Die angenehme Wärme fördert die Durchblutung, die Regeneration der Haut und tiefe Entspannung. Für alle Hauttypen geeignet; nach der Behandlung wirkt die Haut frisch und strahlend.", "lymfa-telo": "Eine sanfte manuelle Lymphdrainage des ganzen Körpers mit langsamen Bewegungen in Richtung der Lymphbahnen. Sie fördert den Abtransport überschüssiger Flüssigkeit, die Durchblutung und ein Gefühl der Leichtigkeit in den Beinen und im ganzen Körper. Eine angenehm beruhigende Behandlung ohne Öle.", "tehotenska": "Eine sanfte Druckmassage in bequemer Kleidung, abgestimmt auf werdende Mütter. Sie lindert schonend Rücken- und Kopfschmerzen, Verspannungen, Schwellungen und Unruhe und fördert einen besseren Schlaf. Stets mit Blick auf Wohlbefinden und Sicherheit der Mutter.", "whirlpool": "Private Entspannung nur für Sie im Whirlpool und in der Sauna. Das warme Sprudelbad lockert die Muskeln, die Sauna wärmt auf und hilft dem Körper abzuschalten. Zu allen Behandlungen gibt es eine Karaffe Wasser gratis, dazu ein Glas Champagner. Der perfekte Abschluss einer Massage oder ein eigenständiges Wellness-Erlebnis.", "fiji": "Ein sinnliches Körperritual, inspiriert von den Fidschi-Inseln. Es beginnt mit einem cremigen Kokos-Peeling, folgt mit einer wärmenden Packung aus Körperbutter und dem Auflegen von Lavasteinen und endet mit einer sanften Ölmassage. Die Haut bleibt zart, gepflegt und duftet nach den Tropen.", "cukr": "Ein luxuriöses Körperritual mit einem Peeling aus fidschianischem Zuckerrohr, tropischen Ölen und Kokosmilch. Es entfernt sanft abgestorbene Hautzellen und versorgt den Körper tief mit Nährstoffen und Feuchtigkeit. Nach der Behandlung ist die Haut seidig glatt und erfrischt."};
